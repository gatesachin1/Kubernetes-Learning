apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-app
  annotations:
    kubernetes.io/change-cause: "Updated nginx to 1.25"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: new-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: new-app
    spec:
      containers:
      - name: new-app
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 3