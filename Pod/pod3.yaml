## Pod with ConfigMap & Secret

apiVersion: v1
kind: Pod
metadata:
  name: config-pod
spec:
  containers:
    - name: app
      image: nginx:latest
      env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password